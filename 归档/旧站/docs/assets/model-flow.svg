</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="48" y="54" class="title">大模型双路径注册</text>
<text x="48" y="86" class="sub">管理平台注册 + Backend SDK 注册，最终汇聚到统一 Model Control Plane</text>
<g filter="url(#shadow)"><rect x="55" y="135" width="390" height="210" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><rect x="55" y="135" width="8" height="210" rx="4" fill="#2563eb" opacity=".95"/><text x="79" y="169" class="h">路径 A：管理平台注册</text><text x="79" y="195" class="s">创建 Provider / Endpoint / Secret</text><text x="79" y="215" class="s">发现或配置 Model / Health Check</text><text x="79" y="235" class="s">绑定 Application</text></g><g filter="url(#shadow)"><rect x="55" y="455" width="390" height="210" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/><rect x="55" y="455" width="8" height="210" rx="4" fill="#16a34a" opacity=".95"/><text x="79" y="489" class="h">路径 B：Backend SDK 注册</text><text x="79" y="515" class="s">托管式：配置写入底座</text><text x="79" y="535" class="s">Remote Provider：请求回调业务后台</text><text x="79" y="555" class="s">适合内网 / 私有模型 / 特殊鉴权</text></g><g filter="url(#shadow)"><rect x="585" y="220" width="430" height="370" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="585" y="220" width="8" height="370" rx="4" fill="#7c3aed" opacity=".95"/><text x="609" y="254" class="h">Model Control Plane</text><text x="609" y="280" class="s">ModelProviderRegistry</text><text x="609" y="300" class="s">ModelRegistry</text><text x="609" y="320" class="s">ApplicationModelBinding</text><text x="609" y="340" class="s">ModelProfile / Alias</text></g><g filter="url(#shadow)"><rect x="1160" y="170" width="370" height="170" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/><rect x="1160" y="170" width="8" height="170" rx="4" fill="#ea580c" opacity=".95"/><text x="1184" y="204" class="h">Application A</text><text x="1184" y="230" class="s">fast → qwen-turbo</text><text x="1184" y="250" class="s">balanced → deepseek-chat</text><text x="1184" y="270" class="s">reasoning → private-model</text></g><g filter="url(#shadow)"><rect x="1160" y="430" width="370" height="170" rx="18" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/><rect x="1160" y="430" width="8" height="170" rx="4" fill="#db2777" opacity=".95"/><text x="1184" y="464" class="h">Agent Definition</text><text x="1184" y="490" class="s">modelProfile: reasoning</text><text x="1184" y="510" class="s">不绑定物理模型 ID</text></g><path d="M445,240 L585,310" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="515.0" y="267.0" text-anchor="middle" class="s">Control API</text><path d="M445,555 L585,500" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="515.0" y="519.5" text-anchor="middle" class="s">SDK / Remote</text><path d="M1015,350 L1160,255" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1087.5" y="294.5" text-anchor="middle" class="s">binding</text><path d="M1345,340 L1345,430" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1345.0" y="377.0" text-anchor="middle" class="s">profile resolve</text></svg>