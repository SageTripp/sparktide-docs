<text x="48" y="54" class="title">UI Capability 注册与渲染</text>
<text x="48" y="86" class="sub">底座注册“组件协议”，前端注册“组件实现”</text>
<g filter="url(#shadow)"><rect x="55" y="130" width="350" height="170" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><rect x="55" y="130" width="8" height="170" rx="4" fill="#2563eb" opacity=".95"/><text x="79" y="164" class="h">前端工程</text><text x="79" y="190" class="s">实现 React / Vue / Compose Renderer</text><text x="79" y="210" class="s">定义组件输入 Schema</text></g><g filter="url(#shadow)"><rect x="455" y="130" width="350" height="170" rx="18" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/><rect x="455" y="130" width="8" height="170" rx="4" fill="#0891b2" opacity=".95"/><text x="479" y="164" class="h">Frontend SDK</text><text x="479" y="190" class="s">UIRendererRegistry</text><text x="479" y="210" class="s">生成 Client Capability Manifest</text></g><g filter="url(#shadow)"><rect x="855" y="130" width="350" height="170" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/><rect x="855" y="130" width="8" height="170" rx="4" fill="#7c3aed" opacity=".95"/><text x="879" y="164" class="h">智能体底座</text><text x="879" y="190" class="s">UICapabilityRegistry</text><text x="879" y="210" class="s">ID / Version / Schema / Policy</text></g><g filter="url(#shadow)"><rect x="1255" y="130" width="290" height="170" rx="18" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/><rect x="1255" y="130" width="8" height="170" rx="4" fill="#db2777" opacity=".95"/><text x="1279" y="164" class="h">Agent Definition</text><text x="1279" y="190" class="s">allowedUI[]</text><text x="1279" y="210" class="s">当前 Agent 授权</text></g><path d="M405,215 L455,215" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="430.0" y="207.0" text-anchor="middle" class="s">register renderer</text><path d="M805,215 L855,215" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="830.0" y="207.0" text-anchor="middle" class="s">manifest / SDK</text><path d="M1205,215 L1255,215" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="1230.0" y="207.0" text-anchor="middle" class="s">authorize</text><rect x="55" y="360" width="1490" height="405" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/><text x="800" y="400" text-anchor="middle" class="h">运行时链路</text><g filter="url(#shadow)"><rect x="85" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="85" y="450" width="8" height="145" rx="4" fill="#2563eb" opacity=".95"/><text x="109" y="484" class="h">① 用户提问</text><text x="109" y="510" class="s">需要图表/地图/业务卡片</text></g><path d="M295,522 L325,522" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="325" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="325" y="450" width="8" height="145" rx="4" fill="#7c3aed" opacity=".95"/><text x="349" y="484" class="h">② 计算 Effective UI</text><text x="349" y="510" class="s">Agent ∩ App ∩ Client ∩ Policy</text></g><path d="M535,522 L565,522" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="565" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="565" y="450" width="8" height="145" rx="4" fill="#ea580c" opacity=".95"/><text x="589" y="484" class="h">③ LLM 选择组件</text><text x="589" y="510" class="s">只输出 component + props</text></g><path d="M775,522 L805,522" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="805" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="805" y="450" width="8" height="145" rx="4" fill="#16a34a" opacity=".95"/><text x="829" y="484" class="h">④ Schema 校验</text><text x="829" y="510" class="s">底座校验 Props / Version</text></g><path d="M1015,522 L1045,522" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1045" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="1045" y="450" width="8" height="145" rx="4" fill="#0891b2" opacity=".95"/><text x="1069" y="484" class="h">⑤ ui.created</text><text x="1069" y="510" class="s">Agent Protocol 事件</text></g><path d="M1255,522 L1285,522" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1285" y="450" width="210" height="145" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="1285" y="450" width="8" height="145" rx="4" fill="#db2777" opacity=".95"/><text x="1309" y="484" class="h">⑥ 前端渲染</text><text x="1309" y="510" class="s">Renderer Registry → 真组件</text></g><rect x="260" y="655" width="1080" height="68" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="800" y="683" text-anchor="middle" class="h">安全原则：不执行模型生成的任意 HTML / JS</text><text x="800" y="708" text-anchor="middle" class="s">只能渲染已注册组件 + 经 Schema 校验的 Props；不支持时按 fallback 降级</text></svg>